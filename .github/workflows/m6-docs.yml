name: M6 - Generar PDFs docentes

on:
  push:
    branches: [ main ]
    paths:
      - 'm6.txt'
      - '.github/source/M6_ORIGINAL.md'
      - '.github/scripts/build_m6_docs.py'
      - '.github/scripts/audit_m6_docs.py'
      - '.github/scripts/audit_m6_traceability.py'
      - '.github/scripts/render_m6_docs.py'
      - '.github/workflows/m6-docs.yml'
      - 'M6/6.*/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m6-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Construir, auditar y renderizar M6
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias del render
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-mono poppler-utils
          python -m pip install --upgrade pip
          python -m pip install mistune beautifulsoup4 weasyprint pymupdf pillow

      - name: Construir documentación desde fuente y código
        run: python .github/scripts/build_m6_docs.py

      - name: Auditar trazabilidad y paridad documental
        run: |
          python .github/scripts/audit_m6_traceability.py
          python .github/scripts/audit_m6_docs.py

      - name: Generar y prevalidar PDFs
        run: |
          rm -rf M6/_pdf_build
          mkdir -p M6/_pdf_build
          python .github/scripts/render_m6_docs.py --theory M6/TEORIA_M6.md --practice M6/PRACTICA_M6.md --out-dir M6/_pdf_build
          pdfinfo M6/_pdf_build/TEORIA_M6.pdf | grep -E 'Pages|Page size'
          pdfinfo M6/_pdf_build/PRACTICA_M6.pdf | grep -E 'Pages|Page size'
          sha256sum M6/_pdf_build/TEORIA_M6.pdf M6/_pdf_build/PRACTICA_M6.pdf | tee M6/_pdf_build/SHA256SUMS.txt

      - name: Versionar documentación validada
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp M6/_pdf_build/TEORIA_M6.pdf M6/TEORIA_M6.pdf
          cp M6/_pdf_build/PRACTICA_M6.pdf M6/PRACTICA_M6.pdf
          cp M6/_pdf_build/PRECHECK_M6.json M6/PRECHECK_M6.json
          cp M6/_pdf_build/SHA256SUMS.txt M6/SHA256SUMS.txt
          git add M6/TEORIA_M6.md M6/PRACTICA_M6.md M6/TRAZABILIDAD_M6.md M6/VALIDACION_M6.md M6/AUDITORIA_EDITORIAL_M6.json M6/TEORIA_M6.pdf M6/PRACTICA_M6.pdf M6/PRECHECK_M6.json M6/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Documentación M6 ya coincide."
          else
            git commit -m "Genera documentacion validada del Modulo 6 [skip ci]"
            git status --short
            git push origin HEAD:main
          fi

      - name: Publicar documentación final
        uses: actions/upload-artifact@v4
        with:
          name: M6-documentacion-final
          if-no-files-found: error
          path: |
            M6/_pdf_build/TEORIA_M6.pdf
            M6/_pdf_build/PRACTICA_M6.pdf
            M6/_pdf_build/PRECHECK_M6.json
            M6/_pdf_build/SHA256SUMS.txt
            M6/_pdf_build/contact_*.jpg
