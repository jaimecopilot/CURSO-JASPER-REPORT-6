name: M5 - Construccion reproducible

on:
  push:
    branches: [ main ]
    paths:
      - '.github/source/M5_ORIGINAL_5_1_5_3.md'
      - '.github/source/M5_ORIGINAL_5_4_5_6.md'
      - '.github/scripts/build_m5.py'
      - '.github/workflows/m5-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir M5 desde M4/4.6
        run: python .github/scripts/build_m5.py
      - name: Verificar estructura acumulativa
        run: python .github/scripts/audit_m5_traceability.py
      - name: Publicar M5 construido
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- M5; then
            echo 'M5 ya coincide con la construcción reproducible.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add M5
          git commit -m 'Construye M5 acumulativo desde M4 4.6'
          git push