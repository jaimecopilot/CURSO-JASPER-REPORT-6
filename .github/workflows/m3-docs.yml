name: M3 - Generar PDFs docentes

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/m3-docs.yml'
      - '.github/scripts/render_m3_docs.py'
      - '.github/scripts/audit_m3_docs.py'
      - 'M3/TEORIA_M3.md'
      - 'M3/PRACTICA_M3.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m3-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render y preflight PDFs M3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias del render
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-mono poppler-utils
          python -m pip install --upgrade pip
          python -m pip install mistune beautifulsoup4 weasyprint pymupdf pillow

      - name: Auditar código y paridad documental
        run: |
          python .github/scripts/audit_m3_docs.py

      - name: Generar y prevalidar PDFs
        run: |
          mkdir -p M3/_pdf_build
          python .github/scripts/render_m3_docs.py             --theory M3/TEORIA_M3.md             --practice M3/PRACTICA_M3.md             --out-dir M3/_pdf_build
          pdfinfo M3/_pdf_build/TEORIA_M3.pdf | grep -E 'Pages|Page size'
          pdfinfo M3/_pdf_build/PRACTICA_M3.pdf | grep -E 'Pages|Page size'
          sha256sum M3/_pdf_build/TEORIA_M3.pdf M3/_pdf_build/PRACTICA_M3.pdf | tee M3/_pdf_build/SHA256SUMS.txt

      - name: Actualizar PDFs versionados en main
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          # El render puede dejar cambios locales derivados de fuentes/cache.
          # Para publicar solo los PDFs, sincronizamos los tracked files con
          # el main remoto sin borrar M3/_pdf_build (directorio no versionado).
          git reset --hard origin/main
          cp M3/_pdf_build/TEORIA_M3.pdf M3/TEORIA_M3.pdf
          cp M3/_pdf_build/PRACTICA_M3.pdf M3/PRACTICA_M3.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add M3/TEORIA_M3.pdf M3/PRACTICA_M3.pdf
          if git diff --cached --quiet; then
            echo "Los PDFs versionados ya coinciden con el render validado."
          else
            git commit -m "Regenera PDFs M3 con patrón visual M2 [skip ci]"
            git push
          fi

      - name: Publicar PDFs y auditoría visual
        uses: actions/upload-artifact@v4
        with:
          name: M3-documentacion-final
          if-no-files-found: error
          path: |
            M3/_pdf_build/TEORIA_M3.pdf
            M3/_pdf_build/PRACTICA_M3.pdf
            M3/_pdf_build/PRECHECK_M3.json
            M3/_pdf_build/SHA256SUMS.txt
            M3/_pdf_build/contact_*.jpg
