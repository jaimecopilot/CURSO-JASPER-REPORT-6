name: M6 - Construccion reproducible

on:
  push:
    branches: [ main ]
    paths:
      - 'm6.txt'
      - '.github/source/M6_ORIGINAL.md'
      - '.github/scripts/build_m6.py'
      - '.github/scripts/audit_m6_traceability.py'
      - '.github/workflows/m6-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m6-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir M6 desde M5/5.6
        run: python .github/scripts/build_m6.py

      - name: Verificar cadena acumulativa
        run: python .github/scripts/audit_m6_traceability.py

      - name: Publicar M6 construido
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- M6)" ]; then
            echo 'M6 ya coincide con la construcción reproducible.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add M6
          git commit -m 'Construye M6 acumulativo desde M5 5.6'
          git status --short
          git push origin HEAD:main
