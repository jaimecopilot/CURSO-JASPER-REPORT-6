name: M3 - Validacion end-to-end

on:
  push:
    branches: [ main ]
    paths:
      - 'M3/**'
      - '.github/workflows/m3-e2e.yml'
      - '!M3/VALIDACION_M3.md'
      - '!M3/*/VALIDACION.md'
      - '!M3/*.pdf'
  workflow_dispatch:

jobs:
  checkpoint:
    name: Checkpoint ${{ matrix.checkpoint }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checkpoint: ['3.1','3.2','3.3','3.4','3.5','3.6']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: M3/${{ matrix.checkpoint }}/EditorialReportsJava/pom.xml

      - name: Compilar Java y resolver runtime JasperReports 6.20.0
        working-directory: M3/${{ matrix.checkpoint }}/EditorialReportsJava
        run: |
          mvn -B -ntp clean package
          mvn -B -ntp dependency:build-classpath -Dmdep.outputFile=classpath.txt

      - name: Ejecutar checkpoint desde EditorialReports
        working-directory: M3/${{ matrix.checkpoint }}/EditorialReports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          : > execution.log
          CP="../EditorialReportsJava/target/classes:$(cat ../EditorialReportsJava/classpath.txt)"

          java -cp "$CP" InicializadorBD 2>&1 | tee -a execution.log
          java -cp "$CP" GeneradorInformeConcepto 2>&1 | tee -a execution.log

          case "${{ matrix.checkpoint }}" in
            3.2|3.3|3.4|3.5|3.6)
              java -cp "$CP" GeneradorCatalogoCSV 2>&1 | tee -a execution.log
              ;;
          esac
          case "${{ matrix.checkpoint }}" in
            3.3|3.4|3.5|3.6)
              java -cp "$CP" GeneradorDistribucionXML 2>&1 | tee -a execution.log
              ;;
          esac
          case "${{ matrix.checkpoint }}" in
            3.4|3.5|3.6)
              java -cp "$CP" GeneradorAutoresJSON 2>&1 | tee -a execution.log
              ;;
          esac
          case "${{ matrix.checkpoint }}" in
            3.5|3.6)
              java -cp "$CP" GeneradorInformeVentas 2>&1 | tee -a execution.log
              ;;
          esac

          test -s reports/informe_concepto.jasper
          test -s output/informe_concepto.pdf
          test "$(head -c 5 output/informe_concepto.pdf)" = "%PDF-"
          grep -q "Libros insertados: 14" execution.log

          case "${{ matrix.checkpoint }}" in
            3.2|3.3|3.4|3.5|3.6)
              test -s reports/informe_catalogo_csv.jasper
              test -s output/informe_catalogo_csv.pdf
              test "$(head -c 5 output/informe_catalogo_csv.pdf)" = "%PDF-"
              grep -q "Registros CSV esperados: 14" execution.log
              ;;
          esac
          case "${{ matrix.checkpoint }}" in
            3.3|3.4|3.5|3.6)
              test -s reports/informe_distribucion_xml.jasper
              test -s output/informe_distribucion_xml.pdf
              test "$(head -c 5 output/informe_distribucion_xml.pdf)" = "%PDF-"
              grep -q "Entregas XML esperadas: 8" execution.log
              ;;
          esac
          case "${{ matrix.checkpoint }}" in
            3.4|3.5|3.6)
              test -s reports/informe_autores_json.jasper
              test -s output/informe_autores_json.pdf
              test "$(head -c 5 output/informe_autores_json.pdf)" = "%PDF-"
              grep -q "Autores JSON esperados: 6" execution.log
              ;;
          esac
          case "${{ matrix.checkpoint }}" in
            3.5|3.6)
              test -s reports/informe_ventas.jasper
              test -s output/informe_ventas.pdf
              test "$(head -c 5 output/informe_ventas.pdf)" = "%PDF-"
              grep -q "Ventas insertadas: 9" execution.log
              ;;
          esac

          python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect('../EditorialReportsJava/data/editorial.db')
          assert con.execute('select count(*) from libros').fetchone()[0] == 14
          try:
              sales=con.execute('select count(*) from ventas').fetchone()[0]
          except sqlite3.OperationalError:
              sales=None
          con.close()
          print('SQLite libros=14 ventas=' + str(sales))
          PY
          echo "PASS checkpoint ${{ matrix.checkpoint }}"

      - name: Publicar artefactos de ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M3-${{ matrix.checkpoint }}-runtime
          if-no-files-found: warn
          path: |
            M3/${{ matrix.checkpoint }}/EditorialReports/reports/*.jasper
            M3/${{ matrix.checkpoint }}/EditorialReports/output/*.pdf
            M3/${{ matrix.checkpoint }}/EditorialReports/execution.log
            M3/${{ matrix.checkpoint }}/EditorialReportsJava/data/editorial.db
