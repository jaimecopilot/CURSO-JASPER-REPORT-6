name: M1 - Validacion end-to-end

on:
  push:
    branches: [ main ]
    paths:
      - 'M1/**'
      - '.github/workflows/m1-e2e.yml'
  workflow_dispatch:

jobs:
  checkpoint:
    name: Checkpoint ${{ matrix.checkpoint }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checkpoint: ['1.1','1.2','1.3','1.4','1.5','1.6']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: M1/${{ matrix.checkpoint }}/EditorialReportsJava/pom.xml

      - name: Compilar Java y resolver JasperReports 6.20.0
        working-directory: M1/${{ matrix.checkpoint }}/EditorialReportsJava
        run: |
          mvn -B -ntp clean package
          mvn -B -ntp dependency:build-classpath -Dmdep.outputFile=classpath.txt

      - name: Ejecutar generador con Working Directory del proyecto de informes
        working-directory: M1/${{ matrix.checkpoint }}/EditorialReports
        shell: bash
        run: |
          set -euo pipefail
          CP="../EditorialReportsJava/target/classes:$(cat ../EditorialReportsJava/classpath.txt)"
          java -cp "$CP" GeneradorInformeConcepto 2>&1 | tee execution.log
          test -s reports/informe_concepto.jasper
          test -s output/informe_concepto.pdf
          test "$(head -c 5 output/informe_concepto.pdf)" = "%PDF-"
          echo "PASS checkpoint ${{ matrix.checkpoint }}"

      - name: Publicar artefactos de ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M1-${{ matrix.checkpoint }}-runtime
          if-no-files-found: warn
          path: |
            M1/${{ matrix.checkpoint }}/EditorialReports/reports/informe_concepto.jasper
            M1/${{ matrix.checkpoint }}/EditorialReports/output/informe_concepto.pdf
            M1/${{ matrix.checkpoint }}/EditorialReports/execution.log
